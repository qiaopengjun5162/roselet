services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: roselet
      POSTGRES_USER: roselet
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roselet -d roselet"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    # 默认值不能省：只更新前端时 BACKEND_IMAGE 是空的，而 compose 会先校验
    # 整个 project——空镜像名会让 `docker compose ps/pull web` 直接报
    # "service backend has neither an image nor a build context specified"，
    # 于是一次「只改前端」的发布在动 web 之前就失败了。
    image: ${BACKEND_IMAGE:-ghcr.io/qiaopengjun5162/roselet-backend:latest}
    pull_policy: always
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://roselet:${POSTGRES_PASSWORD}@db:5432/roselet
      PORT: ${PORT:-3001}
      JWT_SECRET: ${JWT_SECRET}
      NODE_ENV: ${NODE_ENV:-production}
      RUST_LOG: ${RUST_LOG:-roselet=info}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      ADMIN_USER_IDS: ${ADMIN_USER_IDS:-}
      PRIVATE_ROSE_MONTHLY_LIMIT: ${PRIVATE_ROSE_MONTHLY_LIMIT:-10}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      db:
        condition: service_healthy

  web:
    # 前端也在同一台机器上跑：国内只有这个裸 IP 是通的，
    # 页面和 API 同源，省掉跨域与证书两件事。
    image: ${WEB_IMAGE:-ghcr.io/qiaopengjun5162/roselet-web:latest}
    pull_policy: always
    restart: unless-stopped
    environment:
      PORT: 3000
      HOSTNAME: 0.0.0.0
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
