name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: roselet_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --tests --benches -- -D warnings

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked

      - name: Audit dependencies
        run: cargo deny check

      - name: Run migrations
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost/roselet_test
        run: |
          cargo install sqlx-cli --no-default-features --features postgres
          sqlx migrate run --source crates/backend/migrations

      - name: Install cargo-nextest
        run: cargo install cargo-nextest --locked

      - name: Run tests
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost/roselet_test
          NO_PROXY: localhost,127.0.0.1
        run: cargo nextest run --workspace --all-features -j1

  frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: cargo install wasm-pack --locked

      - name: Build WASM
        run: cd crates/recommend && wasm-pack build --target web --out-dir ../../apps/web/public/pkg

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install

      - name: Audit production dependencies
        # 守的是「公网可达的 web 包不能带 critical」。先跑守卫测试，再判真实
        # lockfile。判定细节、豁免边界和为什么不用 --audit-level，见脚本头部注释。
        run: |
          pnpm audit:test
          pnpm audit:prod

      - name: Typecheck
        run: pnpm --filter web typecheck

      - name: ESLint
        run: pnpm --filter web lint

      - name: Next build
        run: pnpm build

      - name: Test
        run: pnpm --filter web test:coverage

  miniprogram:
    name: Miniprogram Build
    env:
      TARO_APP_ID: wx4408068e26478673
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: cargo install wasm-pack --locked

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install

      - name: Init miniprogram config
        run: bash scripts/init-miniprogram.sh

      - name: Build WASM for miniprogram
        run: |
          cd crates/recommend
          wasm-pack build --target web --out-dir ../../apps/miniprogram/pkg
          cd ../..
          node scripts/patch-wasm.js

      - name: Typecheck
        run: pnpm --filter @roselet/miniprogram typecheck

      - name: Build miniprogram
        run: cd apps/miniprogram && pnpm build:weapp

      # 源码正确 ≠ 产物正确：后端地址是构建期替换进包里的字面量。
      # 这里真去翻 dist，禁止 localhost 漏进去，并要求包里有 https 后端地址。
      - name: Check baked-in API base
        run: node scripts/verify-miniprogram-build.mjs

      - name: Test miniprogram
        run: cd apps/miniprogram && pnpm test:coverage

  agent-api:
    name: Solana x402 Agent API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: cargo install wasm-pack --locked

      - name: Build Node WASM
        run: cd crates/recommend && wasm-pack build --target nodejs --out-dir ../../apps/agent-api/pkg

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install

      - name: Typecheck
        run: pnpm agent:typecheck

      - name: Test
        run: pnpm agent:test

      - name: Build
        run: pnpm agent:build
