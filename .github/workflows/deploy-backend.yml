name: Deploy Backend

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: production-backend
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  build-and-deploy:
    name: Build image and deploy to Lightsail
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: production
      url: http://47.131.238.0

    steps:
      - name: Resolve deployment metadata
        id: meta
        env:
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |-
          set -euo pipefail
          owner="$(printf '%s' "$REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          echo "sha=$DEPLOY_SHA" >> "$GITHUB_OUTPUT"
          echo "backend_image=ghcr.io/$owner/roselet-backend:$DEPLOY_SHA" >> "$GITHUB_OUTPUT"
          echo "backend_latest=ghcr.io/$owner/roselet-backend:latest" >> "$GITHUB_OUTPUT"
          echo "web_image=ghcr.io/$owner/roselet-web:$DEPLOY_SHA" >> "$GITHUB_OUTPUT"
          echo "web_latest=ghcr.io/$owner/roselet-web:latest" >> "$GITHUB_OUTPUT"

      - name: Check out deployment commit
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.meta.outputs.sha }}
          fetch-depth: 2

      - name: Detect what changed
        id: changes
        env:
          DEPLOY_SHA: ${{ steps.meta.outputs.sha }}
        run: |-
          set -euo pipefail

          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
            echo "web=true" >> "$GITHUB_OUTPUT"
            echo "any=true" >> "$GITHUB_OUTPUT"
            echo "Manual dispatch: deploying backend and web."
            exit 0
          fi

          base="$(git rev-parse "$DEPLOY_SHA^" 2>/dev/null || true)"
          if [ -z "$base" ]; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
            echo "web=true" >> "$GITHUB_OUTPUT"
            echo "any=true" >> "$GITHUB_OUTPUT"
            echo "No parent commit found: deploying backend and web."
            exit 0
          fi

          changed_files="$(git diff --name-only "$base" "$DEPLOY_SHA")"
          printf '%s\n' "$changed_files"

          backend=false
          web=false
          config=false
          while IFS= read -r path; do
            case "$path" in
              Cargo.toml|Cargo.lock|Dockerfile.backend|.sqlx/*|\
              crates/backend/*|crates/backend/**|\
              crates/recommend/*|crates/recommend/**|\
              deploy/lightsail/docker-compose.backend.yml)
                backend=true
                ;;
            esac
            case "$path" in
              apps/web/*|apps/web/**|\
              packages/core/*|packages/core/**|\
              Dockerfile.web|pnpm-lock.yaml|package.json|pnpm-workspace.yaml)
                web=true
                ;;
            esac
            case "$path" in
              deploy/lightsail/Caddyfile|\
              scripts/lightsail-deploy.sh|\
              .github/workflows/deploy-backend.yml)
                config=true
                ;;
            esac
          done <<EOF
          $changed_files
          EOF

          any=false
          if [ "$backend" = "true" ] || [ "$web" = "true" ] || [ "$config" = "true" ]; then any=true; fi

          echo "backend=$backend" >> "$GITHUB_OUTPUT"
          echo "web=$web" >> "$GITHUB_OUTPUT"
          echo "any=$any" >> "$GITHUB_OUTPUT"
          echo "backend=$backend web=$web"

      - name: Set up Docker Buildx
        if: steps.changes.outputs.any == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: steps.changes.outputs.any == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push backend image
        if: steps.changes.outputs.backend == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.backend
          push: true
          tags: |
            ${{ steps.meta.outputs.backend_image }}
            ${{ steps.meta.outputs.backend_latest }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.meta.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push web image
        if: steps.changes.outputs.web == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.web
          push: true
          # 页面与 API 同源：国内的入口是这台机器的裸 IP，
          # Vercel 的边缘 IP 在国内连 TLS 握手都过不去。
          build-args: |
            NEXT_PUBLIC_API_URL=http://${{ secrets.LIGHTSAIL_HOST }}
          tags: |
            ${{ steps.meta.outputs.web_image }}
            ${{ steps.meta.outputs.web_latest }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.meta.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Validate deployment secrets
        if: steps.changes.outputs.any == 'true'
        env:
          LIGHTSAIL_HOST: ${{ secrets.LIGHTSAIL_HOST }}
          LIGHTSAIL_USER: ${{ secrets.LIGHTSAIL_USER }}
          LIGHTSAIL_SSH_KEY: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          LIGHTSAIL_KNOWN_HOSTS: ${{ secrets.LIGHTSAIL_KNOWN_HOSTS }}
        run: |-
          set -euo pipefail
          test -n "$LIGHTSAIL_HOST"
          test -n "$LIGHTSAIL_USER"
          test -n "$LIGHTSAIL_SSH_KEY"
          test -n "$LIGHTSAIL_KNOWN_HOSTS"

      - name: Install SSH credentials
        if: steps.changes.outputs.any == 'true'
        env:
          LIGHTSAIL_SSH_KEY: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          LIGHTSAIL_KNOWN_HOSTS: ${{ secrets.LIGHTSAIL_KNOWN_HOSTS }}
        run: |-
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$LIGHTSAIL_SSH_KEY" > ~/.ssh/lightsail
          chmod 600 ~/.ssh/lightsail
          printf '%s\n' "$LIGHTSAIL_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Pull deployment commit on Lightsail
        if: steps.changes.outputs.any == 'true'
        env:
          LIGHTSAIL_HOST: ${{ secrets.LIGHTSAIL_HOST }}
          LIGHTSAIL_USER: ${{ secrets.LIGHTSAIL_USER }}
        run: |-
          set -euo pipefail
          ssh -i ~/.ssh/lightsail "$LIGHTSAIL_USER@$LIGHTSAIL_HOST" <<'REMOTE'
          set -euo pipefail
          cd ~/roselet
          git fetch origin main

          # 手工 scp 到工作区的文件会挡住 git pull。2026-11-20 就踩过一次：
          # 备份脚本先传到服务器、之后才提交，于是 `git pull` 报
          # "untracked working tree files would be overwritten" 并放弃，部署整体失败。
          # 处理原则：只有内容与 origin/main 完全一致的文件才让位；
          # 不一致的列出来然后失败——绝不静默覆盖别人手上的东西。
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            if git cat-file -e "origin/main:$f" 2>/dev/null; then
              if git show "origin/main:$f" | cmp -s - "$f"; then
                echo "evicting untracked file identical to origin/main: $f"
                rm -f "$f"
              else
                echo "::error::untracked file would block the pull and differs from origin/main: $f"
                exit 1
              fi
            fi
          done < <(git ls-files --others --exclude-standard)

          git checkout main
          git pull --ff-only origin main
          chmod +x scripts/lightsail-deploy.sh
          REMOTE

      - name: Log in to GHCR on Lightsail
        if: steps.changes.outputs.any == 'true'
        env:
          LIGHTSAIL_HOST: ${{ secrets.LIGHTSAIL_HOST }}
          LIGHTSAIL_USER: ${{ secrets.LIGHTSAIL_USER }}
          GHCR_TOKEN: ${{ github.token }}
        run: |-
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | ssh -i ~/.ssh/lightsail "$LIGHTSAIL_USER@$LIGHTSAIL_HOST" \
            "sudo docker login ghcr.io -u '${{ github.actor }}' --password-stdin"

      - name: Deploy on Lightsail
        if: steps.changes.outputs.any == 'true'
        env:
          LIGHTSAIL_HOST: ${{ secrets.LIGHTSAIL_HOST }}
          LIGHTSAIL_USER: ${{ secrets.LIGHTSAIL_USER }}
          BACKEND_IMAGE: ${{ steps.changes.outputs.backend == 'true' && steps.meta.outputs.backend_image || '' }}
          WEB_IMAGE: ${{ steps.changes.outputs.web == 'true' && steps.meta.outputs.web_image || '' }}
        run: |-
          set -euo pipefail
          ssh -i ~/.ssh/lightsail "$LIGHTSAIL_USER@$LIGHTSAIL_HOST" \
            "cd ~/roselet && BACKEND_IMAGE='$BACKEND_IMAGE' WEB_IMAGE='$WEB_IMAGE' bash scripts/lightsail-deploy.sh"

      - name: Public smoke test
        if: steps.changes.outputs.any == 'true'
        env:
          LIGHTSAIL_HOST: ${{ secrets.LIGHTSAIL_HOST }}
        run: |-
          set -euo pipefail
          curl -fsS "https://roselet.$LIGHTSAIL_HOST.sslip.io/health"
          echo
          curl -fsS "http://$LIGHTSAIL_HOST/api/garden?per_page=1" > /dev/null
          curl -fsS "http://$LIGHTSAIL_HOST/" | grep -q "<!DOCTYPE html"

      - name: Log out from GHCR on Lightsail
        if: always() && steps.changes.outputs.any == 'true'
        env:
          LIGHTSAIL_HOST: ${{ secrets.LIGHTSAIL_HOST }}
          LIGHTSAIL_USER: ${{ secrets.LIGHTSAIL_USER }}
        run: |-
          ssh -i ~/.ssh/lightsail "$LIGHTSAIL_USER@$LIGHTSAIL_HOST" \
            "sudo docker logout ghcr.io || true"
